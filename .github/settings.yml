---
# Synced to GitHub by https://probot.github.io/apps/settings/
#
# The App reacts to pushes that touch THIS file. A change to the upstream
# `_extends:` source does not trigger a sync on its own — when a commons change
# should propagate here, touch this file as well (a comment edit is enough) so
# the App re-runs the merge. Tracked upstream as nolte/gh-plumbing#331.
#
# What the commons already supplies, and this file therefore does NOT restate:
#   - default_branch: develop          (FR-013)
#   - squash-merge only                (keeps develop linear for the drafter)
#   - the portfolio-wide label set
#
# What the commons deliberately leaves empty, so consumers must declare it:
#   - required_status_checks.contexts  (FR-015)
#
# Branch entries merge by `name`, so declaring only `develop` here leaves any
# inherited entry for other branches intact.

# Last propagation: 2026-08-01 — fourth sync: SC-007. Protection on develop was deleted through the
# API on purpose, to check that this file restores it rather than merely having created it once.
# Previously 2026-07-31 — third sync: required contexts declared. The first applied repository
# settings and labels but left develop unprotected; see the branches block for
# why. Touch this line to force a re-merge of the commons.

_extends: gh-plumbing:.github/commons-settings.yml

repository:
  name: claude-goose
  description: >-
    Reusable, revision-safe multi-stage implementation plans for Goose,
    with Claude Code as an ACP provider.
  topics: goose, claude-code, acp, spec-driven-development, review-automation

branches:
  - name: develop
    protection:
      required_status_checks:
        strict: true
        # Both contexts were verified green in CI before being required here.
        # A required context that no workflow produces blocks every pull request
        # forever, and one that always fails teaches contributors to ignore
        # checks -- so neither name was written down until a run proved it
        # exists and passes.
        #
        # shared / Static CI Tests  -- six classes from the pinned shared workflow
        # Tooled Checks             -- prose and recipe-parse, which need vale and goose
        contexts:
          - shared / Static CI Tests
          - Tooled Checks
      # A protection block whose every rule is a no-op is not applied at all.
      # The first sync set repository settings and labels correctly but left
      # develop unprotected, because `contexts: []` plus
      # `required_approving_review_count: 0` amounts to "require nothing".
      #
      # These rules bite without inventing a phantom check: no force pushes, no
      # deletion, linear history. Review and status-check requirements are added
      # in T027, once the workflow that produces those checks exists.
      required_pull_request_reviews: null
      enforce_admins: false
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
      restrictions: null

# NOTE ON `main`, deliberately not declared here.
#
# `main` is already protected by a repository RULESET
# (`default-branch-protection`: pull_request, deletion, non_fast_forward,
# required_linear_history). Rulesets and classic branch protection are separate
# mechanisms that coexist; both are evaluated and the stricter wins.
#
# This file configures classic protection. Adding a `main` entry here would
# layer a second, weaker mechanism over a working one without replacing it, and
# would invite the belief that this file is what guards `main`. It is not.
#
# A check for "is main protected?" must query BOTH mechanisms. Querying only
# GET /repos/../branches/main/protection returns 404 here and reads as
# "unprotected" while the ruleset actively rejects pushes — a mistake this
# project made once and recorded in OMISSIONS.md.
