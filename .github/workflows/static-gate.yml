---
name: Static Gate

# Runs unconditionally on every pull request targeting the integration branch
# (FR-009). NO path filters: a path filter is a decision that certain changes
# need no verification, which is exactly the assumption defects exploit.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

# Minimum permission set (FR-026). The gate reads; it never writes.
permissions:
  contents: read

# A gate run may be cancelled when superseded -- unlike release workflows,
# which must never be cancelled in flight (FR-027).
concurrency:
  group: static-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Six of the ten check classes need nothing beyond Python and pre-commit, so
  # they come from the shared workflow rather than being reimplemented here
  # (FR-028). Pinned to a tag, never a branch (FR-012, SC-013).
  #
  # Produces the status context: `shared / Static CI Tests`
  shared:
    uses: nolte/gh-plumbing/.github/workflows/reusable-pre-commit.yaml@v1.1.26

  # The remaining classes need tools the shared workflow does not install:
  # vale for prose, goose for the recipe parse check. They are repository
  # -specific rather than shared pipeline mechanics, so implementing them here
  # does not contradict FR-028 -- nothing about a Goose recipe check is
  # identical across repositories.
  #
  # Produces the status context: `tooled / Tooled Checks`
  tooled:
    name: Tooled Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install the pinned check toolchain
        run: pip install -r requirements-ci.txt

      # Installed by download rather than via errata-ai/vale-action. That action
      # lints as its primary function and fails the step on findings before the
      # style package has been synced -- it cannot be used merely to place a
      # binary. The prose class must run through the same script as locally, or
      # the two can disagree (SC-004).
      - name: Install vale
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v3.17.0/vale_3.17.0_Linux_64-bit.tar.gz" \
            -o /tmp/vale.tar.gz
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/vale.tar.gz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install goose
        id: goose
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/aaif-goose/goose/releases/download/v1.45.0/download_cli.sh \
            -o /tmp/install-goose.sh || {
              echo "::error::goose installer could not be fetched"
              exit 1
            }
          CONFIGURE=false bash /tmp/install-goose.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Named explicitly rather than by stage. A hook with no `stages:` key runs
      # in every stage, so `--hook-stage manual` alone re-runs the six classes
      # the shared job already covered -- and fails this job for their findings.
      - name: Run the tool-dependent classes
        run: |
          pre-commit run recipe-parse --hook-stage manual --all-files --show-diff-on-failure
          pre-commit run prose --hook-stage manual --all-files --show-diff-on-failure
