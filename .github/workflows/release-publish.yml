---
name: Release Publish

# The tag and the person dispatching are part of the run's identity (FR-023),
# so they belong in the run list rather than only in the log. Without this,
# every run in the list reads `Release Publish` and the tag can only be
# recovered by opening the run.
run-name: >-
  Publish ${{ inputs.tag }}${{ inputs.dry_run && ' (dry run)' || '' }}
  — dispatched by @${{ github.actor }}

# Draft → Published, and nothing else (FR-019). workflow_dispatch only: a
# release must never happen as a side effect of a merge.
#
# The shared workflow refuses on the draft's state, and on nothing else. Its
# four guards, all in the `Resolve draft` step (SC-010):
#   1. no open draft exists at all                        (FR-020)
#   2. no open draft carries the requested tag            (FR-021)
#   3. several drafts carry it — the state is corrupt
#   4. the draft's target SHA is unreachable from develop
#
# It does NOT check whether required status checks are green. An earlier
# version of this comment claimed it did; that was an unsourced assertion and
# is corrected here. See OMISSIONS.md, "The publish does not read CI status".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish. Must match an open release-drafter draft."
        required: true
        type: string
      dry_run:
        description: "Validate every condition without flipping draft=false."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# NO `concurrency:` BLOCK HERE, DELIBERATELY -- and it must stay that way.
#
# FR-027 (a publish is never cancelled in flight) is satisfied, but by the
# called workflow, not by this one: reusable-release-publish.yml declares
# `group: release-publish` with `cancel-in-progress: false` itself.
#
# Declaring the same group here deadlocks the run. Concurrency groups are
# scoped to the repository, not to a single workflow, so this caller would
# hold `release-publish` while the job it starts queues for that very group.
# The run then dies before any job is created: zero jobs, no annotation, no
# log -- a failure that looks like a missing secret or a bad input and is
# neither. Four dispatches were spent on that misreading.
jobs:
  publish:
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-publish.yml@v1.1.26
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
      app-id: ${{ vars.PORTFOLIO_APP_ID }}
      auto-align: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      app-private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
