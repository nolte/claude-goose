---
name: Dependency Review

# Supply-chain obligation (FR-029). This repository ships no dependency
# manifest for its deliverables -- the check toolchain in requirements-ci.txt
# is a pipeline input, not a product dependency -- so the obligation is
# discharged by record rather than by a scan with findings. OMISSIONS.md says so.
on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    uses: nolte/gh-plumbing/.github/workflows/reusable-dependency-review.yaml@v1.1.26
