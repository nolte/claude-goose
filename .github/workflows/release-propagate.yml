---
name: Release Propagate

# Brings the release-presentation branch in line with the published release
# (FR-024). `main` is written by this workflow and by nothing else; a direct
# human push is rejected by the repository ruleset.
#
# EXPECTED NOT TO START on `release: published`. The release event is emitted
# under the default token, which by platform design does not trigger further
# workflow runs. This is a known constraint, not a defect to debug, and
# OMISSIONS.md records it with its revisit condition.
#
# The workflow_dispatch input is therefore the working path today, not a
# convenience -- the shared workflow documents it as the escape hatch for
# exactly this case.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to fast-forward the presentation branch to."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-propagate
  cancel-in-progress: false

jobs:
  propagate:
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-cd-refresh-master.yml@v1.1.26
    with:
      from_branch: ${{ inputs.tag || github.event.release.tag_name }}
      app-id: ${{ vars.PORTFOLIO_APP_ID }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      app-private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
