---
name: Automerge

# Merges an approved pull request once every required check is green (FR-016).
on:
  pull_request:
    types: [labeled, unlabeled, synchronize, opened, edited, ready_for_review, reopened, unlocked]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    uses: nolte/gh-plumbing/.github/workflows/reusable-automerge.yaml@v1.1.26
    with:
      app-id: ${{ vars.PORTFOLIO_APP_ID }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      # app-private-key is NOT passed. The secret does not exist in this
      # repository, and referencing a non-existent secret in a cross-repository
      # reusable call fails the run before any job starts -- with no annotation,
      # which is what made this hard to see. It is optional in the contract, so
      # omitting it is legal; the workflow falls through to GITHUB_TOKEN.
