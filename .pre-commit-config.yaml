---
# The static gate. These definitions are the single source of truth: CI runs
# exactly this file, so `task ci` on a workstation and the pipeline cannot
# disagree (SC-004).
#
# Every rev is an exact tag. No branches, no ranges (FR-012, SC-013).

repos:
  # Format class (FR-007) and YAML parse class (FR-001)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        name: check-yaml (YAML parse class)
        # The review recipe and fixtures are Goose recipes, not plain YAML
        # documents; they are validated by their own classes instead.
        exclude: ^(process/|tests/goose-implementation-review/fixtures/)

  # YAML lint, stricter than parse alone (FR-001)
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yml]

  # Markdown lint class (FR-002)
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.yaml]
        # Three trees are excluded for the same reason: their contents may not
        # be edited, so reporting defects in them would be reporting work
        # nobody is permitted to do.
        #   .specify/, .claude/  vendored and hashed by the specify CLI (FR-033)
        #   baselines/goose/     PUBLISHED revisions are immutable; a report
        #                        citing one must find it byte-identical
        exclude: ^(\.specify|\.claude|baselines/goose)/


  # Classes with no upstream hook: defined locally, invoked through the task
  # runner so they behave identically here and in CI (FR-008).
  - repo: local
    hooks:
      - id: recipe-schema
        name: recipe schema class
        entry: ./scripts/check-recipe-schema.sh process/goose-implementation-review/recipe.yaml
        language: system
        pass_filenames: false
        files: ^process/goose-implementation-review/recipe\.yaml$

      - id: recipe-parse
        name: recipe parse class (goose --explain)
        # Needs the goose binary; runs in the tooled CI job, not the shared one.
        stages: [manual]
        entry: ./scripts/check-recipe-parse.sh process/goose-implementation-review/recipe.yaml
        language: system
        pass_filenames: false
        files: ^process/goose-implementation-review/recipe\.yaml$

      - id: prose
        name: prose lint class (vale)
        # Needs the vale binary and a synced style package.
        stages: [manual]
        entry: ./scripts/check-prose.sh
        language: system
        pass_filenames: false
        files: \.md$

      - id: internal-links
        name: internal link class (offline)
        entry: ./scripts/check-internal-links.sh
        language: system
        pass_filenames: false
        files: \.md$

      - id: manifest-integrity
        name: manifest integrity class (FR-033)
        # `always_run`, unlike every class above. The others react to a changed
        # file; this one must notice an edit to any of the 20 vendored files,
        # and naming them here would duplicate the manifest it exists to read.
        entry: ./scripts/check-manifest-integrity.sh
        language: system
        pass_filenames: false
        always_run: true
