StylesPath = ".vale"
MinAlertLevel = error

# Consumed from the portfolio's published package, not authored here (FR-005,
# FR-028). Pinned to an exact release; the asset was verified before pinning.
#
# The package supplies a technical VOCABULARY rather than rules -- its
# nolte-styles/ directory ships none. Declaring `BasedOnStyles = nolte-styles`
# would activate an empty style and silently check nothing.
Packages = https://github.com/nolte/vale-style/releases/download/v0.1.17/nolte-styles.zip

# Two vocabularies: the portfolio's, and this project's own field names and
# domain terms. See .vale/config/vocabularies/project/accept.txt for why the
# field names cannot simply be rewritten into backticks.
Vocab = technical, project

IgnoredScopes = code, tt, em

[*.md]
BasedOnStyles = Vale

# Instruction artifacts for an LLM, not prose for a human reader.
[CLAUDE.md]
BasedOnStyles =
