---
extends: default

rules:
  line-length:
    max: 120
    level: warning
  # Vendored and generated YAML does not consistently carry `---`; requiring it
  # would flag files this repository must not edit.
  document-start: disable
  truthy:
    # GitHub workflows use `on:` as a key, which yamllint reads as a boolean.
    check-keys: false
  comments:
    min-spaces-from-content: 1

ignore: |
  .specify/
  .vale/
