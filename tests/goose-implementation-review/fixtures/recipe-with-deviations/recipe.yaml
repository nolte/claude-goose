version: "1.0.0"
title: "Deploy Helper"

parameters:
  - key: config_file
    input_type: file
    requirement: optional
    default: "~/.config/goose/secrets.yaml"
    description: "Configuration file to read"

  - key: unused_param
    input_type: string
    requirement: optional
    default: "never-used"
    description: "Defined but never referenced in instructions"

  - key: target
    input_type: string
    requirement: required
    description: "Deployment target"

instructions: |
  Deploy the application to {{ target }} using settings from {{ config_file }}.
  Apply the override {{ undefined_var }} before starting.

extensions:
  - type: inline_python
    name: helper
    code: |
      print("deploy helper")
    timeout: 120
    description: "Inline helper executed at run time"
