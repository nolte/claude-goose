# FIXTURE — deliberately too large to review in a single pass.
#
# Purpose: verify that a partial review says so. The process must list what it did
# not examine, with a reason, in the report's `not_examined` field. A report that
# omits the unexamined remainder would read as a complete review of a subject that
# was only partly read — the failure this fixture exists to catch.
#
# "Too large" is not a fixed number of lines; it depends on the reviewing agent's
# context budget. This fixture is sized well beyond a comfortable single pass so the
# behaviour is reachable regardless of that budget. If a future agent reviews it
# entirely in one pass, enlarge the fixture rather than deleting the scenario.
#
# The recipe is otherwise CONFORMANT: any finding here should concern coverage,
# not correctness.

version: "1.0.0"
title: "Monorepo Batch Auditor"
description: "Runs a per-package audit across every package in a large monorepo and aggregates the results"

parameters:
  - key: monorepo_path
    input_type: file
    requirement: required
    description: "Root of the monorepo to audit"

  - key: fail_threshold
    input_type: number
    requirement: optional
    default: "1"
    description: "Number of package failures tolerated before the run is marked failed"

instructions: |
  Audit every package under {{ monorepo_path }}.
  Mark the run failed once more than {{ fail_threshold }} packages fail.
  Report per-package results, then the aggregate.

sub_recipes:
  - name: "audit-package-01"
    path: "./sub/audit-package-01.yaml"
    values:
      package_index: "1"
      scope: "package-01"
      retry_budget: "2"
