version: "1.0.0"
title: "Changelog Summarizer"
description: "Summarizes a changelog into release highlights for a chosen audience"

parameters:
  - key: changelog_path
    input_type: file
    requirement: required
    description: "The changelog to summarize"

  - key: audience
    input_type: string
    requirement: optional
    default: "end users"
    description: "Who the summary is written for"

  - key: report_style
    input_type: select
    requirement: optional
    default: "bullets"
    description: "How the summary is formatted"
    options:
      - "bullets"
      - "prose"

instructions: |
  Read the changelog at {{ changelog_path }} and summarize it for {{ audience }}.
  Format the summary as {{ report_style }}.
  Report only what the changelog states; do not infer unreleased work.

extensions:
  - type: builtin
    name: developer
